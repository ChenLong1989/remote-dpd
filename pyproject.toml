[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-dpd"
version = "0.1.0"
description = "Device-driven, hardware-independent ILC DPD service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.135,<1",
    "numpy>=1.24",
    "scipy>=1.10",
    "uvicorn>=0.30,<1",
    "watchdog>=3.0",
]

[project.optional-dependencies]
# Real-station adapter (remote_dpd.real_bench) packages. The adapter talks to
# the PXIe-5842 through the NI RFIC SCPI server over NI-VISA and writes NI
# RFmx-style TDMS waveforms with nptdms; the NI software stack (NI-VISA, RFIC
# Test Software) is provided by the station and is not installable from PyPI.
real-hardware = [
    "PyVISA>=1.15",
    "nptdms>=1.11",
]

[project.scripts]
remote-dpd = "remote_dpd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["remote_dpd*"]

[tool.setuptools.package-data]
remote_dpd = ["web_static/*.css", "web_static/*.html", "web_static/*.js"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-dpd"
version = "0.1.0"
description = "MAT-compatible, MATLAB-free remote ILC DPD service"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "watchdog>=3.0",
]

[project.optional-dependencies]
research = [
    "matplotlib>=3.8",
    "pdfplumber>=0.11",
    "psutil>=5.9",
    "pypdf>=5.0",
    "reportlab>=4.0",
    "threadpoolctl>=3.5",
]

[project.scripts]
remote-dpd = "remote_dpd.run_filewatch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["remote_dpd*", "experiments*"]
